server:
  port: 8081
  address: 0.0.0.0

spring:
  application:
    name: SmartTrashBackend

firebase:
  service-account: classpath:serviceAccountKey.json
  database-url: https://pbl5-f21e6-default-rtdb.asia-southeast1.firebasedatabase.app
  storage-bucket: pbl5-f21e6.appspot.com

iot:
  # Thay đổi key này trước khi deploy production
  api-key: iot-secret-key-pbl5

cors:
  # Danh sách domain được phép gọi API (phân cách bằng dấu phẩy)
  allowed-origins: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000

smartbin:
  compartment-capacity-liters: ${SMARTBIN_COMPARTMENT_CAPACITY_LITERS:10}
  # 5 phút 30 giây không có raw sensor log thì tạo cảnh báo OFFLINE
  offline-after-ms: ${SMARTBIN_OFFLINE_AFTER_MS:330000}

  # Bật/tắt Firestore listener theo dõi raw sensor logs
  offline-listener-enabled: ${SMARTBIN_OFFLINE_LISTENER_ENABLED:true}